name: Build Edge Image

on:
  schedule:
    - cron: "0 4 * * *"   # daily at 04:00 UTC
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/stabilitymatrix-vnc

jobs:
  build-edge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Get SM main branch HEAD SHA
        id: get-sha
        run: |
          SHA=$(curl -sf \
            https://api.github.com/repos/LykosAI/StabilityMatrix/commits/main \
            | jq -r '.sha' | cut -c1-7)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Check if edge SHA already published
        id: edge-check
        run: |
          SHA="${{ steps.get-sha.outputs.sha }}"
          TOKEN=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64 -w 0)
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Basic ${TOKEN}" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${{ env.IMAGE_NAME }}/manifests/${SHA}")
          if [[ "$HTTP" == "200" ]]; then
            echo "already_built=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set build date
        id: build-date
        run: echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push edge
        if: steps.edge-check.outputs.already_built != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:edge
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get-sha.outputs.sha }}
          build-args: |
            SM_REF=main
            SM_VERSION=edge
            SM_COMMIT=${{ steps.get-sha.outputs.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max