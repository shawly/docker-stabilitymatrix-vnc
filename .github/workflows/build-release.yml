name: Build Release Image

on:
  schedule:
    - cron: "0 */4 * * *"   # poll SM releases every 4 hours
  workflow_dispatch:
    inputs:
      sm_version:
        description: "StabilityMatrix version to build (e.g. v2.15.7)"
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/stabilitymatrix-vnc

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      sm_version: ${{ steps.get-release.outputs.version }}
      sm_tag: ${{ steps.get-release.outputs.tag }}
      sm_sha: ${{ steps.get-release.outputs.sha }}
    steps:
      - name: Get latest SM release
        id: get-release
        run: |
          # github.event.inputs is only populated on workflow_dispatch triggers;
          # on schedule triggers it is empty. Use env var indirection to avoid
          # the expression error when inputs context doesn't exist.
          MANUAL_VER="${{ github.event.inputs.sm_version }}"
          if [[ -n "$MANUAL_VER" ]]; then
            TAG="$MANUAL_VER"
          else
            TAG=$(curl -sf https://api.github.com/repos/LykosAI/StabilityMatrix/releases/latest \
              | jq -r '.tag_name')
          fi
          VERSION="${TAG#v}"
          # /git/refs/ is the correct plural form per GitHub REST API spec
          REF_OBJ=$(curl -sf "https://api.github.com/repos/LykosAI/StabilityMatrix/git/refs/tags/${TAG}")
          TAG_TYPE=$(echo "$REF_OBJ" | jq -r '.object.type')
          TAG_OBJ_SHA=$(echo "$REF_OBJ" | jq -r '.object.sha')
          if [[ "$TAG_TYPE" == "tag" ]]; then
            # Annotated tag: dereference to commit SHA
            SHA=$(curl -sf "https://api.github.com/repos/LykosAI/StabilityMatrix/git/tags/${TAG_OBJ_SHA}" \
              | jq -r '.object.sha' | cut -c1-7)
          else
            SHA=$(echo "$TAG_OBJ_SHA" | cut -c1-7)
          fi
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}"         >> "$GITHUB_OUTPUT"

      - name: Check if image already exists in GHCR
        id: compare
        run: |
          VERSION="${{ steps.get-release.outputs.version }}"
          # GHCR requires Basic auth with base64-encoded token for anonymous manifest checks
          TOKEN=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64)
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Basic ${TOKEN}" \
            "https://ghcr.io/v2/${{ github.repository }}/manifests/${VERSION}")
          if [[ "$HTTP" == "200" ]]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute build date
        id: build-date
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        run: |
          VERSION="${{ needs.check-upstream.outputs.sm_version }}"
          SHA="${{ needs.check-upstream.outputs.sm_sha }}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          REG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          TAGS="${REG}:latest"
          TAGS="${TAGS},${REG}:${VERSION}"
          TAGS="${TAGS},${REG}:${MINOR}"
          TAGS="${TAGS},${REG}:${MAJOR}"
          TAGS="${TAGS},${REG}:${SHA}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            SM_REF=${{ needs.check-upstream.outputs.sm_tag }}
            SM_VERSION=${{ needs.check-upstream.outputs.sm_version }}
            SM_COMMIT=${{ needs.check-upstream.outputs.sm_sha }}
            BUILD_DATE=${{ steps.build-date.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max